<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="app">
        <img src="" alt="">
        <section
            class="flex flex-col gap-5 justify-center items-center h-screen w-full bg-[url('https://i.pinimg.com/1200x/c9/91/f1/c991f1a7440e196560c0116cdb00d55d.jpg')] bg-no-repeat bg-cover">
            <div class="absolute w-full h-screen bg-black/10"></div>
            <div class="py-2 border-b-3 px-30 border-blue-500 rounded-sm z-999">
                <h1 class="text-white font-[500] text-7xl">Tic Tac Toe</h1>
            </div>
            <div class="z-999">
                <p v-if="message"
                    class="bg-blue-500 border-6 border-blue-400 rounded-lg px-5 py-2 text-white text-2xl font-semibold">
                    {{message}}</p>

            </div>
            <div class="grid grid-cols-3  gap-2 z-999">
                <div v-for="(row, rowIndex) in boardCells" :key="rowIndex">
                    <div v-for="(cell, colIndex) in row" :key="colIndex"
                        class="w-30 h-30 m-4 bg-blue-500 border-10 cursor-pointer hover:saturate-300 border-blue-400 flex items-center justify-center text-7xl text-center hover:scale-109 duration-500 rounded-sm"
                        @click="cellClicked(rowIndex, colIndex)" :class="{'text-gray-50' : cell === 'X',
                                'text-white' : cell === 'O',
                                'cursor-not-allowed' : cell !== '' || winner}">
                        {{cell}}
                    </div>
                </div>
            </div>

            <div class="z-999">
                <button @click="restartGame"
                    class="px-5 py-2 bg-blue-500 cursor-pointer hover:saturate-500 border-6 border-blue-400 text-white font-bold rounded-lg">Restart</button>
            </div>
        </section>

    </div>



    <script>
        Vue.createApp({
            data() {
                return {
                    message: "",
                    boardCells: [
                        ["", "", ""],
                        ["", "", ""],
                        ["", "", ""]
                    ],
                    currentPlayer: 'X',
                    message: "Let's Start!",
                    winner: null
                }
            },
            methods: {
              
                cellClicked(row, col) {
                    if (this.boardCells[row][col] === "") {
                        this.boardCells[row][col] = this.currentPlayer;
                      
                        if (this.isWinner(this.currentPlayer)) {
                            this.message = `Player ${this.currentPlayer} win!`
                        } else if (this.isDraw(this.currentPlayer)) {
                            this.message = `Draw!`
                        } else {
                            if (this.currentPlayer === 'X') {
                                this.currentPlayer = 'O';
                                this.message = "Player O's turn"
                            } else {
                                this.currentPlayer = 'X'
                                this.message = "Player X's turn"
                            }
                        }
                    }
                },

                    isWinner(user) {
                        // row
                        for(let row = 0; row< this.boardCells.length; row++) {
            if (this.boardCells[row][0] == user
                && this.boardCells[row][1] == user
                && this.boardCells[row][2] == user) {
                return true;
            }
        }
        // col
        for (let col = 0; col < this.boardCells.length; col++) {
            if (this.boardCells[0][col] == user
                && this.boardCells[1][col] == user
                && this.boardCells[2][col] == user) {
                return true;
            }
        }
        // diagonals
        if (this.boardCells[0][0] == user
            && this.boardCells[1][1] == user
            && this.boardCells[2][2] == user) {
            return true;
        }
        if (this.boardCells[0][2] == user
            && this.boardCells[1][1] == user
            && this.boardCells[2][0] == user) {
            return true;
        }
        return false;
                },

        restartGame() {
            this.boardCells = [
                ["", "", ""],
                ["", "", ""],
                ["", "", ""]
            ];
            this.message = "Player X's turn";
            this.winner = null;
            this.currentPlayer = 'X';

        },

        isDraw() {
            for (let row = 0; row < this.boardCells.length; row++) {
                for (let col = 0; col < this.boardCells.length; col++) {
                    if (this.boardCells[row][col] === '') {
                        return false;
                    }
                }
            }
            return !this.isWinner('X') && !this.isWinner('O');
        }
            }
        }).mount('#app');
    </script>




</body>

</html>
